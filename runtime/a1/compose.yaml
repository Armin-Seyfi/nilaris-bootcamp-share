name: nilaris-synth
services:
  postgres:
    image: postgres@sha256:a8a18afebc8b2b529112c931f193151b712e566b7a49563dc0f328d51f652087
    platform: linux/arm64
    restart: 'no'
    mem_limit: 1g
    cpus: 1
    ports: ['127.0.0.1:55432:5432']
    environment:
      POSTGRES_PASSWORD: ${A1_ADMIN_PASSWORD:?task secret required}
      A1_APP_PASSWORD: ${A1_APP_PASSWORD:?task secret required}
      A1_MIGRATION_PASSWORD: ${A1_MIGRATION_PASSWORD:?task secret required}
      A1_TEST_PASSWORD: ${A1_TEST_PASSWORD:?task secret required}
      A1_N8N_PASSWORD: ${A1_N8N_PASSWORD:?task secret required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ['postgres', '-c', 'statement_timeout=5000', '-c', 'transaction_timeout=5000', '-c', 'lock_timeout=1000', '-c', 'fsync=on', '-c', 'synchronous_commit=on', '-c', 'full_page_writes=on', '-c', 'max_connections=20', '-c', 'log_statement=none', '-c', 'log_min_error_statement=panic']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-nilaris.sql:ro
    logging: &logging
      driver: json-file
      options: {max-size: 8m, max-file: '2'}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 2s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:dde92482b17091ee31b5076073c4e868be5286ab124f5348b9a2b2ef9d771d39
    platform: linux/arm64
    restart: 'no'
    mem_limit: 768m
    cpus: 0.5
    ports: ['127.0.0.1:5679:5678']
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: nilaris_n8n
      DB_POSTGRESDB_USER: nilaris_n8n
      DB_POSTGRESDB_PASSWORD: ${A1_N8N_PASSWORD:?task secret required}
      DB_POSTGRESDB_POOL_SIZE: '2'
      N8N_ENCRYPTION_KEY: ${A1_N8N_KEY:?task secret required}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_AI_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_SECURE_COOKIE: 'false'
      EXECUTIONS_MODE: regular
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5679
      WEBHOOK_URL: http://127.0.0.1:5679/
      N8N_LOG_LEVEL: warn
    volumes: [n8ndata:/home/node/.n8n]
    logging: *logging
volumes:
  pgdata:
  n8ndata:
