<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Original evidence · NILARIS Reviewer</title>
  <link rel="stylesheet" href="/rfq/style.css">
  <link rel="stylesheet" href="mark.css">
  <script defer src="/rfq/app.js"></script>
</head>
<body>
<header><strong>NILARIS</strong><span>Original evidence</span></header>
<main id="source-view">
  <h1 id="file"></h1><p id="locator"></p>
  <p class="revision" id="revision"></p>
  <a id="pdf" target="_blank" rel="noopener">Open original PDF at row ↗</a>
  <pre id="original-row-text" aria-label="Original evidence text"></pre>
  <figure><img src="page.png" alt="Original RFQ page with the selected passage outlined">
  <span id="evidence-row" aria-label="Selected evidence passage"></span></figure>
  <p id="status" role="status"></p>
</main>
</body>
</html>
