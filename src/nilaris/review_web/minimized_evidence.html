<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NILARIS · Minimized evidence</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/minimized-evidence.js" defer></script>
</head>
<body class="refined-b">
  <header><span class="brand">NILARIS</span><a href="/">Customer dashboard</a></header>
  <main class="panel">
    <div class="panel-head">
      <h1>Minimized evidence</h1>
    </div>
    <p id="status" role="status">Loading saved preview…</p>
    <p id="preview" class="plain-text" hidden></p>
    <button id="build" type="button" hidden>Create local preview</button>
    <button id="source" type="button" hidden>Inspect private link to original evidence</button>
    <section id="original" hidden>
      <h2>Private original evidence</h2>
      <p id="mapping" class="plain-text"></p>
      <p id="excerpt" class="plain-text"></p>
    </section>
  </main>
</body>
</html>
