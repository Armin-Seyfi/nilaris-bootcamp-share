<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whole-Schema preview · NILARIS</title><link rel="stylesheet" href="/review-first-b.css">
<script type="module" src="/schema-preview.mjs"></script></head><body>
<header><b>NILARIS</b> Approver workspace <a href="/">Customer dashboard</a></header>
<main><h1>Whole-Schema preview</h1><p id="status" role="status">Opening saved revision…</p>
<article id="preview" hidden>
<p id="pin"></p><section class="schema"><h2 id="readiness"></h2><ul id="unresolved"></ul></section>
<section><h2>Included Attributes</h2><div class="preview-matrix"><table id="matrix"></table></div></section>
<section><h2>Excluded from this version</h2><ul id="excluded"></ul></section>
<section><h2 id="associations"></h2><div id="relations"></div></section>
<section class="source" id="evidence"><h2>Original evidence</h2><p id="document"></p><blockquote id="passage"></blockquote>
<p id="digest" class="source-digest"></p><details id="inspect"><summary>Inspect original PDF</summary>
<span id="pdf-status" role="status"></span><a id="pdf" target="_blank" rel="noopener" hidden>Open original passage</a></details></section>
<section><h2>Correction history</h2><ol id="history"></ol><button id="older" hidden>Show older revisions</button></section>
</article></main></body></html>
